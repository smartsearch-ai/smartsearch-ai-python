[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "smartsearch-ai"
version = "0.1.0.dev0"
description = "Python SDK for SmartSearch AI project search, Workplace and user provisioning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Weblink Technologies" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/smartsearch-ai/smartsearch-ai-integration-examples"

[tool.hatch.build.targets.wheel]
packages = ["src/smartsearch_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/smartsearch_ai", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
